# CETECH Frappeverse trial — independent Dokploy Docker Compose application.
# Image is built in GitHub Actions and must exist before first deployment.
# Keep Dokploy automatic deployments disabled until validated.
x-frappe-image: &frappe-image
  image: ${FRAPPE_SUITE_IMAGE:?Set FRAPPE_SUITE_IMAGE to the published GHCR build tag}
  platform: linux/amd64
  restart: unless-stopped

x-sites: &sites
  - suite-sites:/home/frappe/frappe-bench/sites

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SUITE_DB_PASSWORD:?Set a NEW database password in Dokploy}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - suite-db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - suite-redis-queue-data:/data

  configurator:
    <<: *frappe-image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    volumes: *sites

  backend:
    <<: *frappe-image
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes: *sites

  websocket:
    <<: *frappe-image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes: *sites

  frontend:
    <<: *frappe-image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    expose:
      - "8080"
    depends_on:
      - backend
      - websocket
    volumes: *sites

  queue-short:
    <<: *frappe-image
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes: *sites

  queue-long:
    <<: *frappe-image
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes: *sites

  scheduler:
    <<: *frappe-image
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes: *sites

volumes:
  suite-sites:
  suite-db-data:
  suite-redis-queue-data:
