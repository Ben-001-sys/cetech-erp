name: Build Frappeverse v16 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-frappeverse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CETECH configuration
        uses: actions/checkout@v4

      - name: Checkout official Frappe Docker build tooling
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Check application manifest
        run: python3 -m json.tool frappe-suite/apps.json > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Frappeverse multi-app image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=frappe-suite/apps.json
          tags: |
            ghcr.io/ben-001-sys/cetech-frappeverse:trial-v16
            ghcr.io/ben-001-sys/cetech-frappeverse:run-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ben-001-sys/cetech-erp
            org.opencontainers.image.description=CETECH isolated Frappe v16 multi-app testing image
